<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SQ Feedback Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#F0F3F9;color:#1B2B4B;font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
input,select,textarea{font-family:inherit;font-size:13px;color:#1B2B4B;border:1.5px solid #D8E0EC;border-radius:8px;padding:9px 12px;background:#FAFBFD;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#1B3060}
textarea{resize:vertical;min-height:70px}
select{cursor:pointer}
button{cursor:pointer;font-family:inherit;border:none;border-radius:8px;font-weight:700;transition:opacity .15s}
button:hover{opacity:.85}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 12px;background:#F5F7FF;color:#374151;font-weight:700;font-size:11px;text-align:left;border-bottom:2px solid #E4EAF4;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #F0F4FA;vertical-align:middle;font-size:12px}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 8px rgba(17,30,56,.07);margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.lbl{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,#D4A843,#C08A1E);color:#fff;padding:10px 22px;font-size:13px}
.btn-navy{background:linear-gradient(135deg,#111E38,#1B3060);color:#fff;padding:10px 22px;font-size:13px}
.btn-ghost{background:#F1F5F9;color:#475569;padding:8px 14px;font-size:12px;font-weight:600}
.btn-se{background:#EEF2FF;color:#3730A3;padding:5px 11px;font-size:11px;font-weight:600;border-radius:7px}
.btn-sg{background:#ECFDF5;color:#065F46;padding:5px 11px;font-size:11px;font-weight:600;border-radius:7px}
.btn-sr{background:#FEE2E2;color:#991B1B;padding:5px 9px;font-size:11px;font-weight:600;border-radius:7px}
.tab-btn{padding:12px 17px;background:none;border:none;border-bottom:3px solid transparent;font-size:13px;font-weight:400;color:#6B7280;margin-bottom:-2px;white-space:nowrap;cursor:pointer}
.tab-btn.active{font-weight:700;color:#111E38;border-bottom-color:#D4A843}
.modal-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,18,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:18px}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 24px 60px rgba(10,18,40,.3)}
.toast{position:fixed;top:70px;right:20px;background:#111E38;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;border-left:4px solid #D4A843;max-width:320px}
.stat-card{background:#fff;border-radius:14px;padding:16px 18px;flex:1;min-width:110px;box-shadow:0 1px 8px rgba(17,30,56,.07)}
.box-b{border:1.5px solid rgba(154,52,18,.13);background:rgba(154,52,18,.04);border-radius:12px;padding:18px;margin-bottom:14px}
.box-s{border:1.5px solid rgba(159,18,57,.13);background:rgba(159,18,57,.04);border-radius:12px;padding:18px;margin-bottom:16px}
.stars span{font-size:28px;cursor:pointer;line-height:1;user-select:none}
.info-box{background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:9px;padding:10px 15px;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.err-box{background:#FEE2E2;color:#991B1B;padding:9px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600}
.dup{font-size:11px;color:#D97706;font-weight:600;margin-top:4px}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ox{overflow-x:auto}
.sm{font-size:11px}.gray{color:#6B7280}.bold{font-weight:600}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var BRANCHES = ["Northgate","Eastfield","Westbridge","Southport","Central Plaza","Harbor","Riverside","Lakeshore","Parkview","Highland","Meadowbrook","Bayside","Crossroads","Summit","Greenfield","Stonebridge","Oakwood","Ridgefield","Sunset","Fairmount","Brookline","Hilltop","Glenwood","Maplewood","Crestview","Cedarfield","Pinegrove"];
var BP_DEFAULT = {};
BRANCHES.forEach(function(b,i){ BP_DEFAULT[b] = ["Nora","Ethan","Elena","Diana"][i%4]; });
var PARTNERS = {Nora:{email:"nora@example.com",full:"Nora Davies"},Ethan:{email:"ethan@example.com",full:"Ethan Hill"},Elena:{email:"elena@example.com",full:"Elena Grant"},Diana:{email:"diana@example.com",full:"Diana Shaw"}};
var CHECKER = "approver@example.com";
var STORAGE_KEY = "sq_demo_v1";
var BP_KEY = "sq_demo_bp";
var ROOT_CAUSES = ["Staff Behavior","Staff Knowledge","Long Waiting Time","Branch Facilities","System / Technical Error","Process Complexity","Communication Issue"];
var RC = {1:"#DC2626",2:"#EA580C",3:"#D97706",4:"#16A34A",5:"#15803D"};
var RL = {1:"Very Poor",2:"Poor",3:"Fair",4:"Good",5:"Excellent"};
var BM = {"Pending":"#FEF3C7|#92400E","Completed":"#D1FAE5|#065F46","Within SLA":"#D1FAE5|#065F46","SLA Breached":"#FEE2E2|#991B1B","Staff Behavior":"#FFE4E6|#9F1239","Staff Knowledge":"#FEE2E2|#991B1B","Long Waiting Time":"#FED7AA|#9A3412","Branch Facilities":"#FFEDD5|#9A3412","System / Technical Error":"#DBEAFE|#1E3A8A","Process Complexity":"#EDE9FE|#4C1D95","Communication Issue":"#D1FAE5|#065F46","Under Review":"#FEF3C7|#92400E","Valid":"#D1FAE5|#065F46","Not Valid":"#FEE2E2|#991B1B"};

function loadBP(){try{var r=localStorage.getItem(BP_KEY);return r?JSON.parse(r):JSON.parse(JSON.stringify(BP_DEFAULT));}catch(e){return JSON.parse(JSON.stringify(BP_DEFAULT));}}
function saveBP(m){try{localStorage.setItem(BP_KEY,JSON.stringify(m));}catch(e){}}
var BP = loadBP();
function ldb(){try{var r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function sdb(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S.cases))}catch(e){}}

var S = {tab:"dashboard",cases:[],form:nf(),editCase:null,delCase:null,otpVal:"",otpSent:false,otpErr:"",toast:"",toastT:null,formErr:"",dupWarn:"",search:"",fMonth:"",fStatus:"",fType:"",aMonth:"",aBranch:"",aPartner:"",wkRange:"thisWeek",emailModal:null,exportData:null,exportCount:0,_wkBranches:[],_wkStart:"",_wkEnd:"",_previewTitle:null};

function nf(){return{customerName:"",customerPhone:"",branch:"",ticketNumber:"",date:td(),branchRating:0,branchComment:"",staffName:"",staffRating:0,staffComment:"",businessPartner:""};}
function td(){return new Date().toISOString().split("T")[0]}
function ndw(d){var x=new Date(d);x.setDate(x.getDate()+1);while(x.getDay()===5||x.getDay()===6)x.setDate(x.getDate()+1);return x.toISOString().split("T")[0]}
function mk(d){return String(d).substring(0,7)}
function fmtM(k){var ms={"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"};var p=String(k).split("-");return(ms[p[1]]||p[1])+" "+p[0]}
function slaBreached(due,st){if(!due||st==="Completed")return false;var day=new Date().getDay();if(day===5||day===6)return false;return new Date()>new Date(due+"T23:59:59");}
function ageDays(d){return Math.floor((new Date()-new Date(d))/86400000)}
function genOTP(){try{var b=new Uint32Array(1);crypto.getRandomValues(b);return String((b[0]%900000)+100000);}catch(e){return String(100000+Math.floor(Math.random()*900000));}}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function notify(m){S.toast=m;if(S.toastT)clearTimeout(S.toastT);render();S.toastT=setTimeout(function(){S.toast="";render();},3200);}
function badge(t){if(!t)return"";var p=(BM[t]||"#F1F5F9|#475569").split("|");return'<span class="badge" style="background:'+p[0]+';color:'+p[1]+'">'+esc(t)+'</span>';}
function starsD(v,sz){sz=sz||13;var h="";for(var i=1;i<=5;i++)h+='<span style="font-size:'+sz+'px;color:'+(i<=v&&v>0?(RC[v]||"#D4A843"):"#E2E8F0")+'">★</span>';return h;}
function ageChip(c){if(c.followUpStatus==="Completed")return'<span style="font-size:10px;font-weight:700;color:#16A34A">✓ Done</span>';var d=ageDays(c.date);var col=d>=3?"#DC2626":d>=1?"#D97706":"#16A34A";return'<span style="font-size:10px;font-weight:700;color:'+col+'">'+d+'d</span>';}
function bOpts(sel){return BRANCHES.map(function(b){return'<option value="'+esc(b)+'"'+(b===sel?" selected":"")+">"+esc(b)+"</option>"}).join("");}
function getMonths(){var seen={};S.cases.forEach(function(c){if(c.month)seen[c.month]=1});return Object.keys(seen).sort().reverse();}

function buildEmail(c){
  var p = PARTNERS[c.businessPartner] || {};
  var partnerName = p.full || c.businessPartner || "Partner";
  var subj = "Low Customer Feedback Notification: " + c.branch;
  var dataLines = [
    "Date            : " + c.date,
    "Branch Name     : " + c.branch,
    (c.branchRating > 0 ? "Branch Rating   : " + c.branchRating + "/5 (" + (RL[c.branchRating]||"") + ")" : null),
    (c.branchRating > 0 && c.branchComment ? "Details         : " + c.branchComment : null),
    (c.staffName ? "Staff Name      : " + c.staffName : null),
    (c.staffName && c.staffRating > 0 ? "Staff Rating    : " + c.staffRating + "/5 (" + (RL[c.staffRating]||"") + ")" : null),
    (c.staffName && c.staffComment ? "Details         : " + c.staffComment : null),
    "Customer Name   : " + (c.customerName || "N/A"),
    "Customer Number : " + (c.customerPhone || "N/A")
  ].filter(function(l){return l!==null;}).join("\n");
  var body = ["Dear "+partnerName+",","","Please find the below low customer feedback notification received on "+c.branch+".","",dataLines,"","Please contact the customer and update us within 1 working day. Deadline: "+c.dueDate,"","","Customer Experience Management Team"].join("\n");
  return {to:p.email||"",subj:subj,body:body};
}
function buildOTPEmail(c,otp){
  var id=String(c.id).slice(-6).toUpperCase();
  var b=["Dear Approver,","","Delete request for Case #"+id+":","","Customer : "+(c.customerName||"N/A"),"Branch   : "+c.branch,"Date     : "+c.date,"Time     : "+new Date().toLocaleString(),"","OTP CODE: "+otp,"","Valid 10 minutes."];
  return{to:CHECKER,subj:"[SQ] Delete OTP | Case #"+id,body:b.join("\n")};
}
function buildOneBranchSection(branchName,startDate,endDate,asFullEmail){
  var p = PARTNERS[BP[branchName]] || {};
  var allCases = S.cases.filter(function(c){return c.branch===branchName&&c.date>=startDate&&c.date<=endDate&&((c.branchRating>0&&c.branchRating<=2)||(c.staffRating>0&&c.staffRating<=2));});
  if(!allCases.length) return null;
  var branchCases = allCases.filter(function(c){return c.branchRating>0&&c.branchRating<=2;});
  var staffCases = allCases.filter(function(c){return c.staffRating>0&&c.staffRating<=2;});
  var staffCount = {};
  staffCases.forEach(function(c){var n=(c.staffName||"").trim();if(n) staffCount[n]=(staffCount[n]||0)+1;});
  var rcCount = {};
  allCases.forEach(function(c){var rcs=c.rootCauses&&c.rootCauses.length?c.rootCauses:(c.validityStatus?[c.validityStatus]:[]);rcs.forEach(function(r){rcCount[r]=(rcCount[r]||0)+1;});});
  var topRC = Object.keys(rcCount).sort(function(a,b){return rcCount[b]-rcCount[a];});
  var stars = function(n){return n>0?("★").repeat(n)+("☆").repeat(5-n)+" ("+n+"/5)":"—";};
  var lines = [];
  if(asFullEmail){
    lines.push("Dear Branch Manager,","");
    lines.push("Customers receive a feedback message after each branch visit. Customers giving low ratings (1-2 stars) are contacted directly by the SQ team.");
    lines.push("","Period : "+startDate+" to "+endDate);
    lines.push("Note   : Customer details are not included. The SQ team handles all follow-ups.","");
  }
  lines.push("=========================================");
  lines.push("  BRANCH: "+branchName);
  lines.push("  Total Low-Rated Cases : "+allCases.length);
  lines.push("  Branch Feedbacks      : "+branchCases.length);
  lines.push("  Staff Feedbacks       : "+staffCases.length);
  if(Object.keys(staffCount).length) lines.push("  Staff Mentioned       : "+Object.keys(staffCount).map(function(k){return k+(staffCount[k]>1?" ("+staffCount[k]+"x)":"");}).join(", "));
  lines.push("=========================================","");
  if(branchCases.length){
    lines.push("-----------------------------------------","A. BRANCH FEEDBACK ("+branchCases.length+")","-----------------------------------------");
    branchCases.forEach(function(c,i){
      lines.push((i+1)+". Date: "+c.date+"  |  Branch Rating: "+stars(c.branchRating));
      if(c.branchComment) lines.push("   Issue      : "+c.branchComment);
      var rcs=c.rootCauses&&c.rootCauses.length?c.rootCauses:(c.validityStatus?[c.validityStatus]:[]);
      if(rcs.length) lines.push("   Root Cause : "+rcs.join(", "));
      lines.push("");
    });
  }
  if(staffCases.length){
    lines.push("-----------------------------------------","B. STAFF FEEDBACK ("+staffCases.length+")","-----------------------------------------");
    staffCases.forEach(function(c,i){
      lines.push((i+1)+". Date: "+c.date+"  |  Staff Rating: "+stars(c.staffRating));
      if(c.staffName) lines.push("   Staff      : "+c.staffName);
      if(c.staffComment) lines.push("   Issue      : "+c.staffComment);
      var rcs=c.rootCauses&&c.rootCauses.length?c.rootCauses:(c.validityStatus?[c.validityStatus]:[]);
      if(rcs.length) lines.push("   Root Cause : "+rcs.join(", "));
      lines.push("");
    });
  }
  if(topRC.length){
    lines.push("-----------------------------------------","MAIN ISSUES THIS WEEK","-----------------------------------------");
    topRC.forEach(function(r){lines.push("  - "+r+": "+rcCount[r]+" case"+(rcCount[r]>1?"s":""));});
    lines.push("");
  }
  if(asFullEmail){
    lines.push("-----------------------------------------","This report is shared for your awareness.","","SQ Team");
    return {to:p.email||"",subj:"[SQ] Weekly Service Quality Summary | "+branchName+" | "+startDate+" to "+endDate,body:lines.join("\n")};
  }
  return lines.join("\n");
}
function buildBranchReport(branchIdx,startDate,endDate){
  var branchName = S._wkBranches[branchIdx];
  if(!branchName) return null;
  return buildOneBranchSection(branchName,startDate,endDate,true);
}
function buildCombinedReport(startDate,endDate){
  var poorCases = S.cases.filter(function(c){return c.date>=startDate&&c.date<=endDate&&((c.branchRating>0&&c.branchRating<=2)||(c.staffRating>0&&c.staffRating<=2));});
  if(!poorCases.length) return null;
  var branchMap = {};
  poorCases.forEach(function(c){if(!branchMap[c.branch])branchMap[c.branch]=[];branchMap[c.branch].push(c);});
  var branches = Object.keys(branchMap).sort(function(a,b){return branchMap[b].length-branchMap[a].length;});
  var header = ["Dear Branch Manager,","","Below is a summary of this week's low-rated visits.","Period : "+startDate+" to "+endDate,"Total  : "+poorCases.length+" low-rated visit"+(poorCases.length>1?"s":"")+" across "+branches.length+" branch"+(branches.length>1?"es":""),""];
  var body = branches.map(function(b){return buildOneBranchSection(b,startDate,endDate,false);}).filter(Boolean);
  var footer = ["","SQ Team"];
  return {to:"",subj:"[SQ] Weekly Service Quality Summary | "+startDate+" to "+endDate,body:header.concat(body).concat(footer).join("\n")};
}

function openEmailModal(data,caseId){if(!data)return;S.emailModal={to:data.to,subj:data.subj,body:data.body,caseId:caseId||null};render();}
function closeEmailModal(){S.emailModal=null;render();}
function openOutlook(){if(!S.emailModal)return;window.open("https://outlook.office.com/mail/deeplink/compose?to="+encodeURIComponent(S.emailModal.to)+"&subject="+encodeURIComponent(S.emailModal.subj)+"&body="+encodeURIComponent(S.emailModal.body),"_blank");}
function copyField(fid,bid){
  var el=document.getElementById(fid);var btn=document.getElementById(bid);if(!el)return;
  if(fid==="em-bd"&&S.emailModal)el.value=S.emailModal.body||"";
  var val=el.value||el.innerText;if(!val)return;
  function done(ok){if(!btn)return;var o=btn.textContent;btn.textContent=ok?"✅ Copied!":"⚠️ Ctrl+C";setTimeout(function(){btn.textContent=o;},2000);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(val).then(function(){done(true);}).catch(function(){done(false);});}else{el.select();try{document.execCommand("copy");done(true);}catch(e){done(false);}}
}

function exportCSV(list){
  if(!list||!list.length){alert("No cases to export.");return;}
  var h=["ID","Date","Customer","Phone","Branch","Ticket","Branch Rtg","Branch Comment","Staff Name","Staff Rtg","Staff Comment","Partner","Due Date","Status","Follow-up Date","Follow-up Notes","Validation","Root Causes","Validation Notes","Email Sent"];
  var rows=list.map(function(c){
    var rcs=c.rootCauses&&c.rootCauses.length?c.rootCauses.join("; "):(c.validityStatus||"");
    return[String(c.id).slice(-6),c.date,c.customerName,c.customerPhone,c.branch,c.ticketNumber||"",c.branchRating||"",c.branchComment||"",c.staffName||"",c.staffRating||"",c.staffComment||"",c.businessPartner||"",c.dueDate,c.followUpStatus,c.followUpDate||"",c.followUpNotes||"",c.caseValidation,rcs,c.validationNotes||"",c.emailSent?"Yes":"No"].map(function(v){return'"'+String(v||"").replace(/"/g,'""')+'"';});
  });
  S.exportData="\uFEFF"+[h.join(",")].concat(rows.map(function(r){return r.join(",")})).join("\n");
  S.exportCount=list.length;S._previewTitle=null;render();
}
function closeExport(){S.exportData=null;S._previewTitle=null;render();}
function downloadCSV(){if(!S.exportData)return;try{var blob=new Blob([S.exportData],{type:"text/csv;charset=utf-8;"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="SQ_"+td()+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},2000);}catch(e){alert("Download failed.");}}
function copyCSV(){var ta=document.getElementById("csv-ta");if(!ta)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value);}else{ta.select();document.execCommand("copy");}}
function clearAnalyticsFilters(){S.aMonth="";S.aBranch="";S.aPartner="";render();}

function getFiltered(){
  var q=(S.search||"").toLowerCase();
  return S.cases.filter(function(c){
    if(S.fMonth&&c.month!==S.fMonth)return false;
    if(S.fStatus&&c.followUpStatus!==S.fStatus)return false;
    if(S.fType){var rcs=c.rootCauses&&c.rootCauses.length?c.rootCauses:(c.validityStatus?[c.validityStatus]:[]);if(rcs.indexOf(S.fType)===-1)return false;}
    if(q&&!(String(c.customerName||"")+String(c.customerPhone||"")+String(c.branch||"")+String(c.staffName||"")+String(c.ticketNumber||"")).toLowerCase().includes(q))return false;
    return true;
  });
}
function getUrgent(){var t=td();return S.cases.filter(function(c){return c.followUpStatus!=="Completed"&&c.dueDate&&c.dueDate<=t;});}
function getStats(){
  var t=td(),m=mk(t);
  return{
    total:S.cases.length,
    month:S.cases.filter(function(c){return c.month===m}).length,
    pending:S.cases.filter(function(c){return c.followUpStatus==="Pending"}).length,
    breached:S.cases.filter(function(c){return slaBreached(c.dueDate,c.followUpStatus)}).length,
    done:S.cases.filter(function(c){return c.followUpStatus==="Completed"}).length,
    staff:S.cases.filter(function(c){return c.rootCauses&&c.rootCauses.indexOf("Staff Behavior")>-1}).length,
    branch:S.cases.filter(function(c){return c.rootCauses&&c.rootCauses.indexOf("Long Waiting Time")>-1}).length,
    valid:S.cases.filter(function(c){return c.caseValidation==="Valid";}).length,
    notValid:S.cases.filter(function(c){return c.caseValidation==="Not Valid";}).length,
    underReview:S.cases.filter(function(c){return c.caseValidation==="Under Review"||!c.caseValidation;}).length,
  };
}
function getRepeatCustomers(){
  var now=new Date(),yearAgo=new Date(now.getFullYear()-1,now.getMonth(),now.getDate());
  var phoneMap={},nameMap={};
  S.cases.forEach(function(c){
    try{var d=new Date(c.date);if(isNaN(d)||d<yearAgo)return;
      var ph=String(c.customerPhone||"").trim();var nm=String(c.customerName||"").trim().toLowerCase();
      if(ph)phoneMap[ph]=(phoneMap[ph]||0)+1;if(nm)nameMap[nm]=(nameMap[nm]||0)+1;
    }catch(e){}
  });
  var phones={},names={};
  Object.keys(phoneMap).forEach(function(k){if(phoneMap[k]>=3)phones[k]=phoneMap[k];});
  Object.keys(nameMap).forEach(function(k){if(nameMap[k]>=3)names[k]=nameMap[k];});
  return{phones:phones,names:names};
}
function isRepeat(c,flagged){try{var ph=String(c.customerPhone||"").trim();var nm=String(c.customerName||"").trim().toLowerCase();return flagged.phones[ph]||flagged.names[nm]||0;}catch(e){return 0;}}

function setTab(t){S.tab=t;render();}
function tf(k,v){S.form[k]=v;}
function onBranch(v){syncFromDOM();S.form.branch=v;S.form.businessPartner=BP[v]||"";render();}
function onPhone(v){
  S.form.customerPhone=v;var warn="";
  if(String(v).length>=7){
    var dup=null;
    for(var i=0;i<S.cases.length;i++){if(String(S.cases[i].customerPhone||"").trim()===String(v).trim()&&S.cases[i].followUpStatus!=="Completed"){dup=S.cases[i];break;}}
    if(dup)warn="⚠️ Open case #"+String(dup.id).slice(-6).toUpperCase()+" - "+dup.branch;
  }
  if(warn!==S.dupWarn){S.dupWarn=warn;syncFromDOM();render();}
}

    h += '<div class="g2"><div><label class="lbl">Branch Rating</label><div class="stars">';
    for(var bi=1;bi<=5;bi++)h+='<span style="color:'+(bi<=ec.branchRating&&ec.branchRating>0?(RC[ec.branchRating]||"#D4A843"):"#E2E8F0")+'" onclick="editStar(\'branchRating\','+bi+')">★</span>';
    h += '</div></div><div><label class="lbl">Staff Rating</label><div class="stars">';
    for(var si=1;si<=5;si++)h+='<span style="color:'+(si<=ec.staffRating&&ec.staffRating>0?(RC[ec.staffRating]||"#D4A843"):"#E2E8F0")+'" onclick="editStar(\'staffRating\','+si+')">★</span>';
    h += '</div></div></div></div>';
    h += '<div style="margin-top:12px"><label class="lbl">Follow-up Notes</label><textarea id="ei-fn" oninput="S.editCase.followUpNotes=this.value" placeholder="What did the customer say?">'+esc(ec.followUpNotes||"")+'</textarea></div>';
    h += '<div style="margin-top:10px"><label class="lbl">Validation Notes</label><textarea id="ei-vn" oninput="S.editCase.validationNotes=this.value" placeholder="Reason &amp; action taken...">'+esc(ec.validationNotes||"")+'</textarea></div>';
    h += '<div class="fr" style="margin-top:20px"><button class="btn-gold" onclick="saveEdit()">💾 Save Update</button><button class="btn-ghost" onclick="closeEdit()">Cancel</button></div>';
    h += '</div></div>';
  }

  // OTP MODAL
  if(S.delCase){
    var dc=S.delCase;
    h += '<div class="modal-ov"><div class="modal-box" style="max-width:460px;text-align:center">';
    h += '<div style="font-size:38px;margin-bottom:10px">🔐</div>';
    h += '<div style="font-size:17px;font-weight:800;color:#111E38;margin-bottom:4px">Delete Approval Required</div>';
    h += '<div style="font-size:12px;color:#6B7280;margin-bottom:20px">OTP will be sent to <strong>'+CHECKER+'</strong></div>';
    h += '<div style="background:#FEF2F2;border:1.5px solid #FECACA;border-radius:10px;padding:14px;margin-bottom:22px;text-align:left">';
    h += '<div style="font-size:12px;font-weight:700;color:#991B1B;margin-bottom:6px">Case to Delete:</div>';
    h += '<div style="font-size:12px;color:#374151"><strong>#'+String(dc.id).slice(-6).toUpperCase()+'</strong> — '+esc(dc.customerName||"No name")+'</div>';
    h += '<div style="font-size:11px;color:#6B7280;margin-top:3px">'+esc(dc.branch)+' · '+dc.date+'</div></div>';
    if(!S.otpSent){
      h += '<button class="btn-navy" style="display:block;width:100%;padding:11px;font-size:13px;margin-bottom:10px" onclick="sendOtp()">📧 Compose OTP Email</button>';
      h += '<button class="btn-ghost" style="width:100%" onclick="cancelDel()">Cancel</button>';
    } else {
      h += '<p style="font-size:12px;color:#374151;margin-bottom:12px">Enter the OTP from the approver\'s email:</p>';
      h += '<input id="otp-inp" style="font-size:22px;font-weight:700;text-align:center;letter-spacing:8px;margin-bottom:8px" placeholder="000000" maxlength="6" inputmode="numeric"/>';
      if(S.otpErr)h+='<div style="color:#DC2626;font-size:12px;font-weight:600;margin-bottom:10px">⚠️ '+esc(S.otpErr)+'</div>';
      h += '<div class="fr" style="margin-top:12px"><button class="btn-sr" style="flex:1;padding:11px;font-size:13px;font-weight:700;border-radius:9px" onclick="confirmDel()">🗑️ Confirm Delete</button><button class="btn-ghost" style="flex:1" onclick="cancelDel()">Cancel</button></div>';
      h += '<div style="margin-top:12px"><button style="background:none;border:none;font-size:11px;color:#6B7280;cursor:pointer;text-decoration:underline" onclick="sendOtp()">Resend OTP email</button></div>';
    }
    h += '</div></div>';
  }

  // EMAIL MODAL
  if(S.emailModal){
    var em=S.emailModal;
    h += '<div class="modal-ov" onclick="if(event.target===this)closeEmailModal()"><div class="modal-box" style="max-width:620px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div style="font-size:16px;font-weight:800;color:#111E38">📧 Send Email</div><button onclick="closeEmailModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9CA3AF">✕</button></div>';
    h += '<div class="info-box"><span>ℹ️</span><div style="font-size:12px;color:#1E40AF">Click <strong>Open in Mail Client</strong> to send. Or copy fields manually.</div></div>';
    h += '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><label class="lbl" style="margin:0">To</label><button id="btn-to" class="btn-ghost" style="padding:3px 10px;font-size:11px" onclick="copyField(\'em-to\',\'btn-to\')">📋 Copy</button></div>';
    h += '<input id="em-to" readonly style="background:#F9FAFB;color:#374151;font-size:13px" value="'+esc(em.to||"")+'"/></div>';
    h += '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><label class="lbl" style="margin:0">Subject</label><button id="btn-su" class="btn-ghost" style="padding:3px 10px;font-size:11px" onclick="copyField(\'em-su\',\'btn-su\')">📋 Copy</button></div>';
    h += '<input id="em-su" readonly style="background:#F9FAFB;color:#374151;font-size:13px" value="'+esc(em.subj||"")+'"/></div>';
    h += '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><label class="lbl" style="margin:0">Body</label><button id="btn-bd" class="btn-ghost" style="padding:3px 10px;font-size:11px" onclick="copyField(\'em-bd\',\'btn-bd\')">📋 Copy</button></div>';
    h += '<textarea id="em-bd" readonly style="height:200px;font-size:12px;font-family:monospace;background:#F9FAFB;color:#374151;resize:none"></textarea></div>';
    h += '<div class="fr"><button class="btn-navy" style="padding:10px 18px;font-size:13px" onclick="openOutlook()">🔵 Open in Mail Client</button><button class="btn-ghost" style="margin-left:auto" onclick="closeEmailModal()">Close</button></div>';
    h += '</div></div>';
  }

  // EXPORT MODAL
  if(S.exportData){
    var etitle=S._previewTitle||"📊 Export Data";
    var esub=S._previewTitle?"Preview":""+S.exportCount+" cases";
    h += '<div class="modal-ov" onclick="if(event.target===this)closeExport()"><div class="modal-box" style="max-width:760px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-size:16px;font-weight:800">'+etitle+'</div><div style="font-size:12px;color:#6B7280;margin-top:2px">'+esub+'</div></div><button onclick="closeExport()" style="background:none;border:none;font-size:19px;cursor:pointer;color:#9CA3AF">✕</button></div>';
    h += '<textarea id="csv-ta" readonly style="width:100%;height:220px;font-size:11px;font-family:monospace;background:#F9FAFB;border:1.5px solid #E4EAF4;border-radius:8px;padding:10px;resize:none;color:#374151"></textarea>';
    h += '<div class="fr" style="margin-top:14px"><button class="btn-gold" onclick="copyCSV()" style="padding:10px 18px;font-size:13px">📋 Copy All</button><button class="btn-navy" onclick="downloadCSV()" style="padding:10px 18px;font-size:13px">⬇ Download</button><button class="btn-ghost" onclick="closeExport()">Close</button></div>';
    h += '</div></div>';
  }

  if(S.toast)h+='<div class="toast">'+esc(S.toast)+'</div>';

  document.getElementById("app").innerHTML = h;
  restoreInputs();
  if(S.emailModal){var ta=document.getElementById("em-bd");if(ta)ta.value=S.emailModal.body||"";}
  if(S.exportData){var cta=document.getElementById("csv-ta");if(cta)cta.value=S.exportData;}
  try{requestAnimationFrame(function(){window.scrollTo(0,sy);});}catch(e){}
}
